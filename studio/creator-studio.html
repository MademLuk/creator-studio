<title>Creator Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: a fixed tool rail (bottom bar on phones) beside one calm stage; one tally-light accent marks the next action. */
:root{
  --bg:#F1F2F4; --surface:#FFFFFF; --sunk:#E8EAED; --ink:#121418; --muted:#6A707A; --line:#DDE0E5;
  --accent:#E2412B; --accent-ink:#FFFFFF; --ok:#1E9A68; --warn:#C98A12; --oyai:#5E3B22;
  --shadow:0 1px 2px rgba(18,20,24,.06),0 8px 24px -12px rgba(18,20,24,.18);
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --body:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"Geist Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r-lg:24px; --r-md:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1012; --surface:#17191D; --sunk:#1F2227; --ink:#ECEDEF; --muted:#8C929B; --line:#2A2E34;
  --accent:#FF5640; --accent-ink:#FFFFFF; --ok:#3CC48C; --warn:#E7AA36; --oyai:#D9AE85;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1012; --surface:#17191D; --sunk:#1F2227; --ink:#ECEDEF; --muted:#8C929B; --line:#2A2E34;
  --accent:#FF5640; --accent-ink:#FFFFFF; --ok:#3CC48C; --warn:#E7AA36; --oyai:#D9AE85;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px -14px rgba(0,0,0,.7); color-scheme:dark}

html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

.app{display:grid;grid-template-columns:112px minmax(0,1fr);height:100%}
.rail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:20px 0;border-right:1px solid var(--line);background:var(--bg)}
.mark{width:44px;height:44px;border-radius:12px;display:block;margin-bottom:16px}
.tab{width:80px;height:80px;border:0;border-radius:22px;background:transparent;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;position:relative;transition:background .15s,color .15s}
.tab small{font-size:12px;font-weight:500;letter-spacing:.01em}
.tab:hover{color:var(--ink);background:var(--sunk)}
.tab[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .dot{position:absolute;top:14px;right:18px;width:8px;height:8px;border-radius:50%;background:var(--ok);display:none}
.tab.done .dot{display:block}
.rail .grow{flex:1}

main{min-width:0;overflow-y:auto;height:100%}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:18px 32px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px)}
.top h1{font:800 28px/1 var(--display);letter-spacing:-.02em;margin:0;flex:1;min-width:0}
.pill{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--muted);white-space:nowrap}
.pill i{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.on i{background:var(--ok)} .pill.off i{background:var(--warn)}
.pill.ex{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,var(--line))}

.stage{padding:8px 32px 120px;max-width:1180px}
section[role="tabpanel"]{display:flex;flex-direction:column;gap:20px}

.btn{height:56px;padding:0 24px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);display:inline-flex;align-items:center;justify-content:center;gap:10px;font-weight:600;font-size:16px;cursor:pointer;transition:transform .12s,box-shadow .15s,background .15s;white-space:nowrap}
.btn:hover{box-shadow:var(--shadow)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:0 10px 24px -12px var(--accent)}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.xl{height:72px;padding:0 32px;font-size:18px;border-radius:20px}
.btn.icon{width:56px;padding:0}
.btn[disabled]{opacity:.4;pointer-events:none}
body.busy .ai{opacity:.4;pointer-events:none}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.row .sp{flex:1}

.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{height:48px;min-width:56px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .sw{width:14px;height:14px;border-radius:5px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:24px}
.label{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.drop{display:grid;place-items:center;gap:14px;min-height:300px;border-radius:28px;background:var(--surface);border:1.5px dashed var(--line);cursor:pointer;text-align:center;padding:32px 16px;transition:border-color .15s,background .15s}
.drop:hover,body.drag .drop{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 5%,var(--surface))}
.drop .big{width:72px;height:72px;border-radius:24px;background:var(--sunk);display:grid;place-items:center}
.drop .big svg{width:32px;height:32px}
.drop b{font:600 22px/1.2 var(--display);letter-spacing:-.01em}
.drop span{color:var(--muted);font-size:14px}
.split{display:grid;grid-template-columns:minmax(0,1fr) 280px;gap:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.stack .btn{width:100%;justify-content:flex-start}

.stat{display:flex;flex-wrap:wrap;gap:24px;align-items:center}
.stat div{display:flex;flex-direction:column}
.stat b{font:600 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.helper{display:flex;align-items:center;gap:16px;padding:18px 20px;border-radius:var(--r-md);background:var(--sunk)}
.helper p{margin:0;flex:1;min-width:0;font-weight:500}
.helper small{display:block;color:var(--muted);font-weight:400}

textarea.field,input.field,select.field{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-md);padding:14px 16px;font-size:15px;line-height:1.5}
input.field,select.field{height:56px;padding:0 16px}
textarea.field{min-height:160px;resize:vertical}

/* header: new job */
.btn.newjob{height:44px;padding:0 18px;border-radius:999px;font-size:14px}
.btn.newjob.armed{background:var(--accent);color:var(--accent-ink);border-color:transparent}
@media (max-width:520px){.btn.newjob span{display:none}.btn.newjob{width:44px;padding:0}}

/* link pipeline */
.linkbar{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 24px;border-radius:28px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow)}
.linkbar:focus-within{border-color:var(--ink)}
.linkbar svg{color:var(--muted)}
.linkbar input{flex:1;min-width:0;border:0;background:transparent;outline:none;font:500 18px/1.3 var(--body);height:56px}
.linkbar .btn{border-radius:20px}
.linkbar .clear{width:44px;height:44px;border:0;border-radius:14px;background:var(--sunk);color:var(--muted);display:grid;place-items:center;cursor:pointer;flex:none}
.linkbar .clear:hover{color:var(--ink)}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px}
.step{display:flex;flex-direction:column;gap:10px;padding:18px 16px;border-radius:20px;background:var(--surface);border:1px solid var(--line);min-width:0}
.step .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;background:var(--sunk);color:var(--muted)}
.step b{font-weight:600;font-size:15px}
.step small{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;min-height:1.2em}
.step .bar{height:4px;border-radius:2px;background:var(--sunk);overflow:hidden}
.step .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .4s}
.step.active{border-color:var(--accent)}
.step.active .ic{background:var(--accent);color:var(--accent-ink)}
.step.done .ic{background:var(--ok);color:#fff}
.step.done .bar i{width:100%;background:var(--ok)}
.step.fail{border-color:var(--warn)} .step.fail .ic{background:var(--warn);color:#fff}
.more{border-radius:var(--r-lg);background:var(--sunk);padding:4px 20px}
.more summary{cursor:pointer;font-weight:600;padding:14px 0;color:var(--muted)}
.more[open]{padding-bottom:20px}
.drop.small{min-height:200px}
#helperPill.on i{background:var(--ok)} #helperPill.off i{background:var(--warn)}
@media (max-width:1000px){.steps{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:520px){.steps{grid-template-columns:repeat(2,minmax(0,1fr))}.linkbar{padding-left:16px}.linkbar input{font-size:16px}}

/* subtitles */
.cues{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden}
.cue{display:grid;grid-template-columns:92px minmax(0,1fr) 44px;gap:16px;padding:14px 20px;border-top:1px solid var(--line);align-items:start}
.cue:first-child{border-top:0}
.cue.two{grid-template-columns:92px minmax(0,1fr) minmax(0,1fr) 44px}
.tc{font:500 13px/1.6 var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.txt{outline:none;border-radius:8px;padding:2px 6px;margin:-2px -6px;min-height:1.5em;overflow-wrap:anywhere}
.txt:focus{background:var(--sunk)}
.src{color:var(--muted);overflow-wrap:anywhere}
.cps{font:500 12px/1.9 var(--mono);color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.cps.hot{color:var(--accent)}
.empty-tr{color:var(--muted);font-style:italic}

/* post */
.voices{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.voice{height:120px;border-radius:24px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;padding:18px;color:var(--ink);transition:box-shadow .15s,transform .12s,border-color .15s}
.voice:hover{box-shadow:var(--shadow)}
.voice:active{transform:scale(.98)}
.voice[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink),var(--shadow)}
.voice:not([aria-pressed="true"]) .logo{opacity:.55;filter:grayscale(.6)}
.voice:hover .logo{opacity:1;filter:none}
.logo{display:block;transition:opacity .15s,filter .15s}
.logo svg{display:block;width:100%;height:100%}
.l-pnt{height:64px;aspect-ratio:1330/1140}
.l-oye{height:30px;aspect-ratio:1148/391}
.l-oyai{height:60px;aspect-ratio:320/283;background:var(--oyai);-webkit-mask-size:contain;mask-size:contain;-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center}
.l-lude{font:600 22px/1 var(--display);letter-spacing:-.01em;white-space:nowrap}
#voiceMini{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#voiceMini .voice{height:84px;border-radius:20px;padding:12px}
#voiceMini .l-pnt{height:46px} #voiceMini .l-oye{height:22px} #voiceMini .l-oyai{height:44px} #voiceMini .l-lude{font-size:17px}
.posts{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.post{display:flex;flex-direction:column;gap:12px}
.post header{display:flex;align-items:center;gap:12px}
.post header b{flex:1;font:600 18px/1 var(--display)}
.post .n{font:500 12px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums}
.post .n.over{color:var(--accent)}
.post .body{white-space:pre-wrap;outline:none;min-height:120px;overflow-wrap:anywhere}
.statement{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.statement .big{font:800 30px/1.1 var(--display);letter-spacing:-.02em;text-wrap:balance;margin:6px 0 0}

/* frames */
.timeline{position:relative;height:40px;border-radius:12px;background:var(--sunk);overflow:hidden}
.timeline i{position:absolute;top:8px;bottom:8px;width:3px;border-radius:2px;background:var(--muted);transform:translateX(-50%)}
.timeline i.on{background:var(--accent);width:5px;top:4px;bottom:4px}
.timeline .ends{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 12px;font:500 11px var(--mono);color:var(--muted);pointer-events:none}
.grid10{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.fr{position:relative;aspect-ratio:16/9;max-width:100%;border-radius:14px;overflow:hidden;border:0;padding:0;cursor:pointer;background:var(--sunk)}
.fr img{width:100%;height:100%;object-fit:cover;display:block}
.fr span{position:absolute;left:8px;bottom:8px;font:500 11px var(--mono);color:#fff;background:rgba(0,0,0,.55);padding:2px 6px;border-radius:6px}
.fr.on{box-shadow:0 0 0 3px var(--accent)}
.fr.ghost{display:grid;place-items:center;color:var(--muted);font:500 12px var(--mono)}
.composer{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:20px;align-items:start}
.canvasbox{border-radius:var(--r-lg);overflow:hidden;background:var(--sunk);display:grid;place-items:center}
.canvasbox canvas{display:block;max-width:100%;height:auto}
.canvasbox.tall canvas{max-height:72vh;width:auto}
.why{font-size:14px;color:var(--muted);margin:0}

/* bible */
.bgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.bgrid .card{display:flex;flex-direction:column;gap:12px}
.bgrid textarea.field{min-height:220px;font-size:14px}
.vt{display:grid;gap:12px}
.vt label{display:flex;align-items:center;height:48px;color:var(--ink)}
.vt .l-pnt{height:44px} .vt .l-oye{height:20px} .vt .l-oyai{height:42px} .vt .l-lude{font-size:17px}
.vt textarea.field{min-height:84px}

/* job + toast */
.job{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:20;display:flex;align-items:center;gap:16px;padding:10px 10px 10px 22px;border-radius:999px;background:var(--ink);color:var(--bg);box-shadow:var(--shadow);width:min(520px,calc(100% - 32px))}
.job b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.job .track{flex:1;height:6px;border-radius:3px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden}
.job .track i{display:block;height:100%;width:0;background:var(--accent);transition:width .3s}
.job button{height:44px;padding:0 18px;border-radius:999px;border:0;background:var(--bg);color:var(--ink);font-weight:600;cursor:pointer}
.toast{position:fixed;left:50%;top:24px;transform:translateX(-50%);z-index:30;padding:14px 22px;border-radius:999px;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px)}
video#vid{display:none}

@media (max-width:900px){
  .split,.composer,.statement,.bgrid{grid-template-columns:minmax(0,1fr)}
  .voices{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid10{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:fixed;left:0;right:0;bottom:0;z-index:10;flex-direction:row;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));border-right:0;border-top:1px solid var(--line);gap:0}
  .rail .mark,.rail .grow{display:none}
  .tab{width:64px;height:64px;border-radius:18px}
  .top{padding:14px 16px;top:env(safe-area-inset-top,0px)}
  .top h1{font-size:22px}
  .stage{padding:4px 16px 160px}
  .cue,.cue.two{grid-template-columns:minmax(0,1fr) 40px;gap:6px 12px}
  .cue .tc{grid-column:1/-1}
  .cue.two .src{grid-column:1/-1}
  .job{bottom:calc(96px + env(safe-area-inset-bottom,0px))}
  .btn{padding:0 18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

    <button class="tab" role="tab" id="t-post" data-tab="post" aria-selected="false"><span class="dot"></span><svg class="i" viewBox="0 0 24 24"><path d="M4 12l16-8-6 16-3-7z"/></svg><small>Post</small></button>
    <div class="grow"></div>
    <button class="tab" role="tab" id="t-bible" data-tab="bible" aria-selected="false"><span class="dot"></span><svg class="i" viewBox="0 0 24 24"><path d="M6 4h10a3 3 0 013 3v13H9a3 3 0 01-3-3z"/><path d="M6 17a3 3 0 013-3h10"/></svg><small>Bible</small></button>
  </nav>

  <main>
    <header class="top">
      <h1 id="h">Link</h1>
      <span class="pill ex" id="exPill" hidden>Example</span>
      <span class="pill" id="claudePill"><i></i><span>Claude</span></span>
      <button class="btn newjob" id="btnNew" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>New job</span></button>
    </header>

    <div class="stage">
      <!-- LINK -->
      <section role="tabpanel" id="p-words">
        <form class="linkbar" id="linkForm" autocomplete="off">
          <svg class="i" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></svg>
          <input id="linkIn" name="link" type="text" inputmode="url" autocomplete="off" placeholder="Paste a video link or a file path" aria-label="Video link or file path">
          <button class="clear" id="linkClear" type="button" aria-label="Clear link" hidden><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
          <button class="btn xl primary" id="btnGo" type="submit">Start</button>
        </form>
        <div class="row">
          <span class="pill" id="helperPill"><i></i><span>Mac helper</span></span>
          <div class="chips" id="modeChips">
            <button class="chip" type="button" data-mode="full" aria-pressed="true">Subtitles + posts</button>
            <button class="chip" type="button" data-mode="raw" aria-pressed="false">Transcript only</button>
          </div>
          <span class="sp"></span>
          <span class="label" id="langLabel">Then translate into</span>
        </div>
        <div class="chips" id="langChips2"></div>

        <ol class="steps" id="steps"></ol>

        <details class="more" id="moreBox">
          <summary>Other ways in</summary>
          <div class="stack">
            <div class="split">
              <label class="drop small" for="fileIn" id="dropWords">
                <span class="big"><svg class="i" viewBox="0 0 24 24"><path d="M12 16V4M7 9l5-5 5 5M4 20h16"/></svg></span>
                <b>Drop a file</b>
                <span>.mp3 · .wav · .srt · .vtt · .txt · video</span>
              </label>
              <div class="stack">
                <button class="btn" id="btnScript" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Paste script</button>
                <button class="btn" id="btnExample" type="button"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Example</button>
              </div>
            </div>
            <div class="card" id="scriptBox" hidden>
              <div class="stack">
                <textarea class="field" id="scriptIn" placeholder="Paste the text spoken in the video"></textarea>
                <div class="row"><span class="sp"></span><button class="btn primary" id="btnMake" type="button">Make subtitles</button></div>
              </div>
            </div>
          </div>
        </details>
        <input type="file" id="fileIn" accept=".mp3,.wav,.m4a,.srt,.vtt,.txt,audio/*,video/*" hidden>

        <div class="card stat" id="wordsStat"></div>
      </section>

      <!-- SUBTITLES -->
      <section role="tabpanel" id="p-subs" hidden>
        <div class="row">
          <button class="btn ai" id="btnClean"><svg class="i" viewBox="0 0 24 24"><path d="M4 20l9-9M14 4l1 3 3 1-3 1-1 3-1-3-3-1 3-1zM18 13l.6 1.6 1.4.4-1.4.6L18 17l-.6-1.4L16 15l1.4-.4z"/></svg>Clean</button>
          <span class="sp"></span>
          <button class="btn icon" id="btnCopy" title="Copy SRT" aria-label="Copy SRT"><svg class="i" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 00-2-2H6a2 2 0 00-2 2v8a2 2 0 002 2h2"/></svg></button>
          <button class="btn dark" id="btnExport"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>Export .srt</button>
          <button class="btn dark" id="btnTxt"><svg class="i" viewBox="0 0 24 24"><path d="M5 4h14v16H5zM9 9h6M9 13h6M9 17h3"/></svg>Export .txt</button>
        </div>
        <div class="card stack">
          <div class="row">
            <span class="label">Spoken</span>
            <select class="field" id="srcLang" aria-label="Spoken language" style="width:auto;min-width:180px;height:48px"></select>
          </div>
          <span class="label">Translate into</span>
          <div class="chips" id="langChips"></div>
          <div class="row"><span class="sp"></span><button class="btn primary ai" id="btnTranslate">Translate</button></div>
        </div>
        <div class="chips" id="viewChips"></div>
        <div class="cues" id="cues"></div>
      </section>

      <!-- POST -->
      <section role="tabpanel" id="p-post" hidden>
        <div class="voices" id="voices"></div>
        <div class="chips" id="platChips"></div>
        <div class="split">
          <textarea class="field" id="story" placeholder="Story or angle (optional). The transcript is used either way."></textarea>
          <div class="stack">
            <input class="field" id="link" placeholder="Video link">
            <select class="field" id="postLang" aria-label="Post language"></select>
            <button class="btn xl primary ai" id="btnWrite">Write posts</button>
          </div>
        </div>
        <div id="postOut" class="stack"></div>
      </section>

      <!-- FRAMES -->
      <section role="tabpanel" id="p-frames" hidden>
        <button class="btn xl primary" id="btnReload" type="button" hidden><svg class="i" viewBox="0 0 24 24"><path d="M4 12a8 8 0 0114-5.3L20 9M20 4v5h-5M20 12a8 8 0 01-14 5.3L4 15M4 20v-5h5"/></svg>Load frames from the last video</button>
        <label class="drop" for="vidIn" id="dropVid">
          <span class="big"><svg class="i" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M10 9.5v5l4-2.5z"/></svg></span>
          <b>Drop the video</b>
          <span>.mp4 · .webm · .mov</span>
        </label>
        <input type="file" id="vidIn" accept="video/*" hidden>
        <div id="framesOn" class="stack" hidden>
          <div class="row">
            <div class="stat" id="vidStat"></div>
            <span class="sp"></span>
            <button class="btn" id="btnNewVid">Change video</button>
            <button class="btn primary" id="btnFind">Find 10 frames</button>
          </div>
          <div class="timeline" id="timeline"><div class="ends"><span>0:00</span><span id="tlEnd"></span></div></div>
          <div class="grid10" id="grid10"></div>
          <div class="composer" id="composer" hidden>
            <div class="canvasbox" id="cbox"><canvas id="thumb" width="1280" height="720"></canvas></div>
            <div class="stack">
              <div class="chips" id="fmtChips">
                <button class="chip" data-fmt="169" aria-pressed="true">16:9</button>
                <button class="chip" data-fmt="916" aria-pressed="false">9:16</button>
              </div>
              <input class="field" id="thumbText" placeholder="Thumbnail text" maxlength="60">
              <div class="chips" id="voiceMini"></div>
              <button class="btn ai" id="btnPick"><svg class="i" viewBox="0 0 24 24"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>Claude picks</button>
              <p class="why" id="why" hidden></p>
              <button class="btn xl dark" id="btnPng"><svg class="i" viewBox="0 0 24 24"><path d="M12 4v12M7 11l5 5 5-5M4 20h16"/></svg>Save PNG</button>
            </div>
          </div>
        </div>
        <video id="vid" muted playsinline preload="auto"></video>
      </section>

      <!-- BIBLE -->
      <section role="tabpanel" id="p-bible" hidden>
        <div class="bgrid">
          <div class="card"><span class="label">House rules</span><textarea class="field" id="bRules"></textarea></div>
          <div class="card"><span class="label">Channels</span><textarea class="field" id="bChannels"></textarea></div>
          <div class="card"><span class="label">Glossary · term = keep</span><textarea class="field" id="bGloss"></textarea></div>
          <div class="card"><span class="label">Voices</span><div class="vt" id="bVoices"></div></div>
        </div>
        <div class="row"><span class="sp"></span><button class="btn" id="btnReset">Reset</button><button class="btn primary" id="btnSaveBible">Save</button></div>
      </section>
    </div>
  </main>
</div>

<div class="job" id="job" hidden><b id="jobLabel">Working</b><span class="track"><i id="jobBar"></i></span><button id="jobStop">Stop</button></div>
<div class="toast" id="toast" hidden></div>

/* UI logo: inherits the token colour of its container */
function logoHTML(id){
  if (id === "ponadto") return `<span class="logo l-pnt">${LOGO_SVG.ponadto}</span>`;
  if (id === "oye") return `<span class="logo l-oye">${LOGO_SVG.oye}</span>`;

/* Canvas logo: always white, for use over video frames */
const LOGO_IMG = {};
function loadImg(src){ return new Promise(res => { const i = new Image(); i.onload = () => res(i); i.onerror = () => res(null); i.src = src; }); }
async function logoImage(id){
  if (id in LOGO_IMG) return LOGO_IMG[id];

  const blocks = txt.replace(/\r/g, "").replace(/^﻿/, "").split(/\n\s*\n/);
  const out = [];
  for (const b of blocks){
    const lines = b.split("\n"); const k = lines.findIndex(l => l.includes("-->"));
    if (k < 0) continue;
    const [a, z] = lines[k].split("-->");
    const t = lines.slice(k + 1).join(" ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim();
    const s = parseTS(a), e = parseTS(z.trim().split(/\s+/)[0]);

  }

}
function wrap2(t, max=42){
  if (t.length <= max) return t;
  const mid = t.length / 2; let best = -1;
  for (let i = 0; i < t.length; i++) if (t[i] === " " && (best < 0 || Math.abs(i - mid) < Math.abs(best - mid))) best = i;
  return best < 0 ? t : t.slice(0, best) + "\n" + t.slice(best + 1);

function scriptToCues(text, total){
  const flat = text.replace(/\s+/g, " ").trim(); if (!flat) return [];
  const sentences = flat.match(/[^.!?…]+[.!?…]*["»”)]*\s*/g) || [flat];
  const parts = [];
  for (let s of sentences){
    s = s.trim(); if (!s) continue;
    if (s.length <= 84){ parts.push(s); continue; }
    let cur = "";
    for (const w of s.split(" ")){
      if ((cur + " " + w).trim().length > 84){ parts.push(cur.trim()); cur = w; } else cur += " " + w;
    }
    if (cur.trim()) parts.push(cur.trim());
  }
  const gap = 0.12, durs = parts.map(p => Math.max(1.2, p.length / 15));
  const sum = durs.reduce((a, b) => a + b, 0) + gap * parts.length;
  const k = total ? total / sum : 1;
  let t = 0;
  return parts.map((p, i) => { const s = t, e = t + durs[i] * k; t = e + gap * k; return { s, e, t:p }; });
}

async function runPipeline(source, prepare){

    toast(IN_APP ? "The Claude app does not see the Mac helper. Quit it (Cmd+Q), reopen it, then press Start again."

    return;
  }

/* spoken language: chosen, or detected once by Claude, else guessed from accents */
function guessLang(){
  const t = S.cues.slice(0, 60).map(c => c.t).join(" ").toLowerCase();
  if (/[ąćęłńśźż]/.test(t)) return "pl";
  if (/[ґєії]/.test(t)) return "uk";
  if (/[ა-ჰ]/.test(t)) return "ka";
  if (/[àâçèéêëîïôûùœ]|\b(le|la|les|une|est|dans|pour|avec)\b/.test(t)) return "fr";
  if (/[ñ¿¡]|\b(el|los|las|una|para|con)\b/.test(t)) return "es";
  if (/[äöüß]|\b(und|der|die|das|ist|nicht)\b/.test(t)) return "de";
  if (/\b(the|and|is|you|with|this)\b/.test(t)) return "en";
  return "";
}
const srcNow = () => (S.srcLang && S.srcLang !== "auto") ? S.srcLang : (S.srcDetected || guessLang());

  if (S.srcLang && S.srcLang !== "auto") return S.srcLang;

      if (r && /^[a-z]{2}$/.test(r.code)) code = r.code;

  S.srcDetected = code || guessLang(); save();

/* Clean: spelling, grammar, syntax, punctuation, without changing meaning or timing */
async function cleanAll(signal, onProg){
  const N = S.cues.length, B = 80;
  for (let i = 0; i < N; i += B){
    const part = S.cues.slice(i, i + B).map(c => c.t);
    const before = S.cues.slice(Math.max(0, i - 3), i).map(c => c.t);
    const prompt = `You proofread subtitle lines from a speech transcript. In each line's own language:
1. Remove filler words and verbal tics: euh, hum, bah, ben, hein, genre, voilà (as a tic), tu vois, du coup (as a tic); um, uh, er, like, you know, I mean, sort of, basically; yyy, eee, no, wiesz, jakby, w sumie; and their equivalents in any other language.
2. Remove stutters, repeated words and false starts (keep the finished sentence, drop the abandoned one).
3. Fix spelling, accents, capitalisation, punctuation, grammar and syntax, and fix words the speech recogniser clearly misheard when the context makes the right word obvious.
Keep the speaker's meaning, voice and register. Never translate, summarise, reorder or add ideas. A line may become shorter, never longer. If a line is only filler, return an empty string for it. Never use em dashes. Write glossary terms exactly as listed.
GLOSSARY:
${glossary()}
${before.length ? `\nPREVIOUS LINES (context only, do not return):\n${JSON.stringify(before)}\n` : ""}
Reply with only a JSON array of exactly ${part.length} strings, same order as the input.

LINES:
${JSON.stringify(part)}`;
    const arr = await sample.json(prompt, { signal });
    if (Array.isArray(arr) && arr.length === part.length)
      arr.forEach((t, k) => { if (typeof t === "string") S.cues[i + k].t = t.trim(); });  /* "" marks a filler-only line */
    onProg(Math.min(1, (i + B) / N), `${Math.min(N, i + B)} / ${N}`);
    if (S.tab === "subs" && S.view === "orig") renderSubs();
  }
  /* drop lines that were only filler, keeping translations aligned */
  const keep = S.cues.map(c => c.t.length > 0);
  const dropped = keep.filter(k => !k).length;
  if (dropped){
    S.cues = S.cues.filter((_, k) => keep[k]);
    for (const l of Object.keys(S.tr)) S.tr[l] = S.tr[l].filter((_, k) => keep[k]);
  }
  S.example = false;
  return dropped;
}
/* Translate into every chosen language except the spoken one; returns lines left empty */
async function translateAll(signal, onProg){
  const src = await srcCode();
  const targets = S.langs.filter(l => l !== src);
  const N = S.cues.length, B = 60, steps = Math.max(1, targets.length * Math.ceil(N / B));
  let step = 0, gaps = 0;
  for (const lang of targets){
    S.tr[lang] = new Array(N).fill("");
    for (let i = 0; i < N; i += B){
      const part = S.cues.slice(i, i + B).map(c => c.t);
      const before = S.cues.slice(Math.max(0, i - 3), i).map(c => c.t);
      const prompt = `Translate these video subtitle lines${src && LANGS[src] ? ` from ${LANGS[src]}` : ""} into ${LANGS[lang]}. Natural spoken style, each line about as short as its source so it reads in time. Keep one output line per input line, same order, never merge or split. Never use em dashes. Glossary terms marked "keep" stay untranslated.
GLOSSARY:
${glossary()}
${before.length ? `\nPREVIOUS LINES (context only, do not translate):\n${JSON.stringify(before)}\n` : ""}
Reply with only a JSON array of exactly ${part.length} strings.

LINES:
${JSON.stringify(part)}`;
      const arr = await sample.json(prompt, { signal });
      if (Array.isArray(arr)) part.forEach((_, k) => { const t = arr[k]; if (typeof t === "string" && t.trim()) S.tr[lang][i + k] = t.trim(); else gaps++; });
      else gaps += part.length;
      step++; onProg(step / steps, `${lang.toUpperCase()} ${Math.min(N, i + B)} / ${N}`);
      if (S.tab === "subs") renderSubs();
    }
  }
  return { gaps, targets };
}

/* plain text: lines joined into paragraphs, a new one after a pause or when the paragraph gets long */
function toTXT(texts){
  const paras = []; let cur = "";
  S.cues.forEach((c, i) => {
    const t = (texts[i] || "").trim(); if (!t) return;
    const prev = i ? S.cues[i - 1] : null;
    if (cur && ((prev && c.s - prev.e > 1.5) || cur.length > 700)){ paras.push(cur); cur = ""; }
    cur = cur ? cur + " " + t : t;
  });
  if (cur) paras.push(cur);
  return paras.join("\n\n") + "\n";
}

  } catch (e){ if (e && e.code !== "cancelled") toast(errCopy(e)); }
  finally { endJob(); save(); render(); }
};

/* ---------- Frames: 10 strongest frames ---------- */
function setVideo(file){
  if (S.video) URL.revokeObjectURL(S.video.url);
  const url = URL.createObjectURL(file), v = $("vid");
  S.video = { url, name:file.name, dur:0, w:0, h:0 }; S.frames = []; S.pick = 0; S.why = "";
  v.onloadedmetadata = () => { if (!S.video) return; S.video.dur = v.duration; S.video.w = v.videoWidth; S.video.h = v.videoHeight; render(); };
  v.onerror = () => { toast("This video does not play in the browser. Export an .mp4 (H.264) and try again."); S.video = null; render(); };
  v.src = url; v.load();
}
function seek(v, t){
  return new Promise(res => {
    let done = false; const fin = () => { if (done) return; done = true; v.removeEventListener("seeked", fin); res(); };
    v.addEventListener("seeked", fin); setTimeout(fin, 5000); v.currentTime = t;
  });
}
function analyse(ctx, W, H){
  const d = ctx.getImageData(0, 0, W, H).data, g = new Float32Array(W * H);
  let sum = 0;
  for (let i = 0; i < W * H; i++){ const y = 0.299 * d[i*4] + 0.587 * d[i*4+1] + 0.114 * d[i*4+2]; g[i] = y; sum += y; }
  const mean = sum / (W * H); let v = 0, lap = 0, lapSq = 0, n = 0;
  for (let i = 0; i < W * H; i++) v += (g[i] - mean) ** 2;
  for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++){
    const i = y * W + x, L = 4 * g[i] - g[i-1] - g[i+1] - g[i-W] - g[i+W]; lap += L; lapSq += L * L; n++;
  }
  const sharp = lapSq / n - (lap / n) ** 2, std = Math.sqrt(v / (W * H));
  const sig = []; const bx = W / 16, by = H / 9;
  for (let y = 0; y < 9; y++) for (let x = 0; x < 16; x++) sig.push(g[Math.floor((y + .5) * by) * W + Math.floor((x + .5) * bx)]);
  const expo = mean < 30 || mean > 230 ? 0.15 : mean < 55 || mean > 205 ? 0.6 : 1;
  /* flat dark frames with little detail are black screens or credit rolls */
  const flat = mean < 45 && std < 40;
  return { score: Math.sqrt(sharp) * expo * (0.4 + Math.min(std, 70) / 70), sig, weak: expo < 0.5 || flat };
}
const sigDiff = (a, b) => a.reduce((s, x, i) => s + Math.abs(x - b[i]), 0) / a.length;
$("btnFind").onclick = async () => {
  const v = $("vid"); if (!S.video || !S.video.dur){ toast("The video is still loading."); return; }
  const ctl = startJob("Scanning"), signal = ctl.signal;
  try {
    const K = 50, d = S.video.dur, a = d * 0.02, z = d * 0.98;
    const sc = document.createElement("canvas"); sc.width = 160; sc.height = 90;
    const sx = sc.getContext("2d", { willReadFrequently:true });
    const cands = [];
    for (let i = 0; i < K; i++){
      if (signal.aborted) throw { code:"cancelled" };
      const t = a + (z - a) * (i + 0.5) / K; await seek(v, t);
      sx.drawImage(v, 0, 0, 160, 90); cands.push({ t, ...analyse(sx, 160, 90) });
      setProg((i + 1) / K * 0.8, `Scanning ${i + 1} / ${K}`);
    }
    const picks = [], fresh = c => !picks.includes(c) && !c.weak && picks.every(p => sigDiff(p.sig, c.sig) > 7);
    for (let k = 0; k < 10; k++){
      const seg = cands.slice(Math.floor(k * K / 10), Math.floor((k + 1) * K / 10)).sort((x, y) => y.score - x.score);
      /* a segment of black or credits borrows the best unused frame from anywhere */
      const pool = [...cands].sort((x, y) => y.score - x.score);
      picks.push(seg.find(fresh) || pool.find(fresh) || seg.find(c => !picks.includes(c)) || seg[0]);
    }
    picks.sort((x, y) => x.t - y.t);
    const W = Math.min(1920, S.video.w || 1280), H = Math.round(W * (S.video.h || 720) / (S.video.w || 1280));
    S.frames = [];
    for (let k = 0; k < picks.length; k++){
      if (signal.aborted) throw { code:"cancelled" };
      await seek(v, picks[k].t);
      const c = document.createElement("canvas"); c.width = W; c.height = H; c.getContext("2d").drawImage(v, 0, 0, W, H);
      const s = document.createElement("canvas"); s.width = 480; s.height = Math.round(480 * H / W); s.getContext("2d").drawImage(c, 0, 0, s.width, s.height);
      S.frames.push({ t:picks[k].t, canvas:c, thumb:s.toDataURL("image/jpeg", 0.8), score:picks[k].score });
      setProg(0.8 + (k + 1) / picks.length * 0.2, `Keeping ${k + 1} / 10`);
    }
    const best = S.frames.reduce((b, f, i) => f.score > S.frames[b].score ? i : b, 0);
    S.pick = best; toast("10 frames kept");
  } catch (e){
    if (e && e.code === "cancelled") toast("Stopped");
    else toast("Could not read frames from this video.");
  } finally { endJob(); render(); }
};
function renderFrames(){
  const has = !!S.video;
  $("dropVid").hidden = has; $("framesOn").hidden = !has;
  $("btnReload").hidden = has || !S.job || !mcp;
  $("btnFind").hidden = !!(S.video && S.video.helper);
  $("btnNewVid").hidden = !!(S.video && S.video.helper);
  if (!has) return;
  const d = S.video.dur || 0;
  $("vidStat").innerHTML = `<div><b>${d ? shortTC(d) : "…"}</b><span>length</span></div><div><b>${S.video.w ? S.video.w + "×" + S.video.h : "…"}</b><span>size</span></div>`;
  $("tlEnd").textContent = d ? shortTC(d) : "";
  $("timeline").querySelectorAll("i").forEach(n => n.remove());
  S.frames.forEach((f, i) => { const m = document.createElement("i"); m.style.left = (f.t / d * 100) + "%"; if (i === S.pick) m.className = "on"; $("timeline").appendChild(m); });
  $("btnFind").textContent = S.frames.length ? "Scan again" : "Find 10 frames";
  $("grid10").innerHTML = S.frames.length
    ? S.frames.map((f, i) => `<button class="fr${i === S.pick ? " on" : ""}" data-f="${i}" aria-label="Frame at ${shortTC(f.t)}"><img src="${f.thumb}" alt=""></button>`).join("")
    : Array.from({ length:10 }, (_, i) => `<div class="fr ghost">${String(i + 1).padStart(2, "0")}</div>`).join("");
  $("composer").hidden = !S.frames.length;
  $("fmtChips").querySelectorAll("[data-fmt]").forEach(b => b.setAttribute("aria-pressed", b.dataset.fmt === S.fmt));
  if ($("thumbText").value === "" && S.thumbText) $("thumbText").value = S.thumbText;
  $("voiceMini").innerHTML = voiceBtns("data-vm");
  $("why").hidden = !S.why; $("why").textContent = S.why;
  if (S.frames.length) drawThumb();
}
$("grid10").addEventListener("click", e => { const b = e.target.closest("[data-f]"); if (b){ S.pick = +b.dataset.f; renderFrames(); } });
$("fmtChips").addEventListener("click", e => { const b = e.target.closest("[data-fmt]"); if (b){ S.fmt = b.dataset.fmt; save(); renderFrames(); } });
$("voiceMini").addEventListener("click", e => { const b = e.target.closest("[data-vm]"); if (b){ S.voice = b.dataset.vm; save(); renderFrames(); } });
$("thumbText").addEventListener("input", e => { S.thumbText = e.target.value; save(); drawThumb(); });
$("btnNewVid").onclick = () => $("vidIn").click();
$("btnReload").onclick = async () => {
  if (!mcp || !S.job || job) return;
  const ctl = startJob("Loading frames");
  try {
    const r = await readHelper("result", { job: S.job });
    await loadFrames(S.job, r, p => setProg(p));
    if (ctl.signal.aborted) return;
    toast("Frames loaded");
  } catch (e){ toast(helperErr(e)); }
  finally { endJob(); render(); }
};

function lineWrap(x, words, max){
  const lines = []; let cur = "";
  for (const w of words){ const t = cur ? cur + " " + w : w; if (x.measureText(t).width > max && cur){ lines.push(cur); cur = w; } else cur = t; }
  if (cur) lines.push(cur); return lines;
}
let drawN = 0;
async function drawThumb(){
  const n = ++drawN, f = S.frames[S.pick]; if (!f) return;
  const c = $("thumb"), tall = S.fmt === "916", W = tall ? 1080 : 1280, H = tall ? 1920 : 720;
  $("cbox").classList.toggle("tall", tall);
  try { await document.fonts.load('800 100px "Bricolage Grotesque"'); await document.fonts.load('600 30px "Geist"'); } catch {}
  if (n !== drawN) return;
  c.width = W; c.height = H; const x = c.getContext("2d"), src = f.canvas;
  const r = Math.max(W / src.width, H / src.height), sw = W / r, sh = H / r;
  x.drawImage(src, (src.width - sw) / 2, (src.height - sh) / 2, sw, sh, 0, 0, W, H);
  const text = (S.thumbText || "").trim().toUpperCase(), col = VOICE_COLOR[S.voice], m = Math.round(W * 0.06);
  if (text){
    const g = x.createLinearGradient(0, H * 0.35, 0, H); g.addColorStop(0, "rgba(0,0,0,0)"); g.addColorStop(1, "rgba(0,0,0,.8)");
    x.fillStyle = g; x.fillRect(0, H * 0.35, W, H * 0.65);
    const words = text.split(/\s+/); let size = tall ? 150 : 128, lines;
    for (;;){ x.font = `800 ${size}px "Bricolage Grotesque", system-ui, sans-serif`; lines = lineWrap(x, words, W - 2 * m);
      if ((lines.length <= 3 && lines.every(l => x.measureText(l).width <= W - 2 * m)) || size <= 48) break; size -= 6; }
    const lh = size * 0.98, base = tall ? H * 0.74 : H - m;
    let y = base - (lines.length - 1) * lh; x.textBaseline = "alphabetic"; x.shadowColor = "rgba(0,0,0,.35)"; x.shadowBlur = 24;
    lines.forEach((l, li) => {
      const ws = l.split(" "); let cx = m;
      ws.forEach((w, wi) => {
        const last = li === lines.length - 1 && wi === ws.length - 1 && words.length > 1;
        x.fillStyle = last ? col.mark : "#ffffff"; x.fillText(w, cx, y); cx += x.measureText(w + " ").width;
      });
      y += lh;
    });
    x.shadowBlur = 0;
  }
  if (S.voice !== "lude"){
    const img = await logoImage(S.voice);
    if (n !== drawN || !img) return;
    const h = S.voice === "oye" ? (tall ? 70 : 52) : (tall ? 150 : 104);
    const w = h * (S.voice === "ponadto" ? 1330 / 1140 : S.voice === "oye" ? 1148 / 391 : img.width / img.height);
    const ty = tall ? H * 0.1 : m * 0.8;
    x.shadowColor = "rgba(0,0,0,.45)"; x.shadowBlur = 18;
    x.drawImage(img, m, ty, w, h);
    x.shadowBlur = 0;
  }
}
$("btnPng").onclick = () => {
  if (!S.frames.length) return;
  if (!downloads){ toast("Saving files works on claude.ai."); return; }
  $("thumb").toBlob(async blob => {
    const base = (S.video.name || "video").replace(/\.[^.]+$/, "");
    try { await downloads.save({ filename:`${base}-thumbnail-${S.fmt === "916" ? "9x16" : "16x9"}.png`, data:blob }); toast("Saved"); }
    catch (e){ if (e && e.code !== "declined") toast("Could not save the image."); }
  }, "image/png");
};
$("btnPick").onclick = async () => {
  if (!needClaude() || !S.frames.length) return;
  const lim = await sample.limits().catch(() => null);
  if (!lim || !lim.images){ toast("This view cannot send images to Claude."); return; }
  const max = Math.min(S.frames.length, lim.images.maxCount);
  const idx = Array.from({ length:max }, (_, k) => Math.round(k * (S.frames.length - 1) / Math.max(1, max - 1)));
  const blobs = await Promise.all(idx.map(i => new Promise(res => {
    const s = document.createElement("canvas"); s.width = 768; s.height = Math.round(768 * S.frames[i].canvas.height / S.frames[i].canvas.width);
    s.getContext("2d").drawImage(S.frames[i].canvas, 0, 0, s.width, s.height); s.toBlob(res, "image/jpeg", 0.82);
  })));
  const transcript = S.cues.map(c => c.t).join(" ").slice(0, 8000);
  const prompt = `These ${max} images are frames from one video, in time order, numbered 1 to ${max}. Pick the best YouTube thumbnail: a clear face or human moment, sharp, readable at small size, room for text. Then write the thumbnail text.

${bibleFor(S.voice)}
${transcript ? `\nTRANSCRIPT EXCERPT:\n${transcript}\n` : ""}
Thumbnail text: four words maximum, in the transcript's language, no venture name.
Reply with only JSON: {"best": number, "text": "...", "why": "one short sentence"}`;
  const ctl = startJob("Claude is looking"); setProg(.35);
  try {
    const r = await sample.json(prompt, { images:blobs, signal:ctl.signal });
    const b = Math.round(Number(r && r.best)); if (b >= 1 && b <= max) S.pick = idx[b - 1];
    if (r && typeof r.text === "string"){ S.thumbText = r.text; $("thumbText").value = r.text; }
    S.why = r && typeof r.why === "string" ? r.why : ""; save();
  } catch (e){ if (e && e.code !== "cancelled") toast(errCopy(e)); }
  finally { endJob(); render(); }
};
